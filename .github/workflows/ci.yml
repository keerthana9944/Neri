name: NERI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax and Compilation
        run: |
          python -m compileall api src app tests

  test-suite:
    name: Automated Unit & RAG Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-validate
    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      OPENAI_API_KEY: "test-mock-openai-key-ci"
      NERI_SUPERVISOR_KEY: "test-super-secret-123"
      NERI_TECHNICIAN_KEY: "test-tech-secret-456"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

  load-test-verification:
    name: Load Test Harness Verification
    runs-on: ubuntu-latest
    needs: test-suite
    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      NERI_SUPERVISOR_KEY: "test-super-secret-123"
      NERI_TECHNICIAN_KEY: "test-tech-secret-456"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Load Test Scripts Syntax & Help
        run: |
          python -m compileall load_tests
          python load_tests/run_load_test.py --help
